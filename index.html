<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Leila, With Love | From Benny</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f051d;
      --card-bg: rgba(30, 15, 55, 0.7);
      --primary-purple: #9d4edd;
      --glow-purple: #c77dff;
      --accent-pink: #ff70a6;
      --paper-bg: #fff8f0;
      --text-dark: #2b1e3a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: radial-gradient(circle at center, #240046 0%, var(--bg-dark) 100%);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Particles Background */
    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .header {
      text-align: center;
      z-index: 2;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3.5rem;
      background: linear-gradient(135deg, #e0aaff, var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(199, 125, 255, 0.3);
    }

    .header p {
      color: #d8b4fe;
      font-size: 1.1rem;
      margin-top: 0.5rem;
    }

    /* Envelopes Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 1100px;
      z-index: 2;
      margin-bottom: 3rem;
    }

    .envelope-card {
      background: var(--card-bg);
      border: 1px solid rgba(199, 125, 255, 0.2);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .envelope-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--glow-purple);
      box-shadow: 0 12px 40px rgba(157, 78, 221, 0.4);
    }

    .envelope-icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .envelope-card:hover .envelope-icon {
      transform: scale(1.2) rotate(-5deg);
    }

    .envelope-card h3 {
      font-size: 1.1rem;
      color: #f3e8ff;
      font-weight: 600;
    }

    /* Action Toolbar */
    .action-bar {
      display: flex;
      gap: 1.5rem;
      z-index: 2;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .btn {
      background: linear-gradient(135deg, var(--primary-purple), var(--accent-pink));
      border: none;
      color: white;
      padding: 0.85rem 1.75rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 112, 166, 0.6);
    }

    .dodging-btn {
      position: relative;
      transition: all 0.2s ease-out;
    }

    /* Letter Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 5, 29, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .letter-paper {
      background: var(--paper-bg);
      color: var(--text-dark);
      width: 90%;
      max-width: 550px;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      transform: translateY(30px) scale(0.9);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background-image: repeating-linear-gradient(var(--paper-bg) 0px, var(--paper-bg) 24px, #e5d5c5 25px);
      line-height: 25px;
    }

    .modal-overlay.active .letter-paper {
      transform: translateY(0) scale(1);
    }

    .letter-paper h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.2rem;
      color: #5a189a;
      margin-bottom: 1rem;
    }

    .letter-content {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      white-space: pre-line;
    }

    .letter-paper .signature {
      font-family: 'Dancing Script', cursive;
      font-size: 1.8rem;
      color: #7b2cbf;
      text-align: right;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      font-size: 1.8rem;
      color: #7b2cbf;
      cursor: pointer;
    }

    /* Hug Pulse Visualizer */
    .hug-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255,112,166,0.8) 0%, rgba(157,78,221,0) 70%);
      border-radius: 50%;
      z-index: 90;
      pointer-events: none;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s ease;
      opacity: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 5rem;
    }

    .hug-overlay.active {
      transform: translate(-50%, -50%) scale(3);
      opacity: 1;
    }
  </style>
</head>
<body>

  <canvas id="particles-canvas"></canvas>

  <div class="header">
    <h1>Open When...</h1>
    <p>For Leila, with all my love — From Benny 💜</p>
  </div>

  <div class="action-bar">
    <button class="btn" onclick="triggerVirtualHug()">🤗 Send Virtual Hug</button>
    <button class="btn dodging-btn" id="loveBtn" onmouseover="dodgeButton()" onclick="dodgeButton()"> Do You Love Me? 💖</button>
  </div>

  <div class="grid" id="envelopeGrid"></div>

  <!-- Letter Modal -->
  <div class="modal-overlay" id="letterModal" onclick="closeLetter(event)">
    <div class="letter-paper" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeLetter()">&times;</button>
      <h2 id="modalTitle">Open When...</h2>
      <div class="letter-content" id="modalContent"></div>
      <div class="signature">Forever Yours,<br>Benny</div>
    </div>
  </div>

  <!-- Hug Effect Visual -->
  <div class="hug-overlay" id="hugOverlay">🫂</div>

  <script>
    const letters = [
      { title: "Open when... You miss me 💭", content: "Close your eyes for three seconds. Take a deep breath. Right now, no matter the distance between us, I am thinking about you. You're my favorite thought every single day." },
      { title: "Open when... You're having a hard day 🌧️", content: "Take a pause, Leila. Whatever went wrong today does not define your peace. I wish I was right there to hold you, but until I can, remember that I am always in your corner." },
      { title: "Open when... You need a smile 😊", content: "Remember that time we couldn't stop laughing? Just thinking about your real, unedited laugh makes my entire day brighter. Smile for me right now!" },
      { title: "Open when... You feel stressed 🧘‍♀️", content: "Unclench your jaw. Drop your shoulders away from your ears. Take a deep breath in... and let it out. You are doing amazing, and everything will sort itself out." },
      { title: "Open when... You can't sleep 🌙", content: "The world is quiet right now. Stop overthinking and rest your eyes. Dream of us, and remember that you are loved beyond measure." },
      { title: "Open when... You're celebrating something 🎉", content: "YES! I am so proud of you! You worked hard for this, and you deserve every single win. I'm cheering for you louder than anyone else!" },
      { title: "Open when... You feel insecure 👑", content: "Look in the mirror. You are looking at the most captivating, brilliant, and beautiful person in my world. Don't ever doubt your value." },
      { title: "Open when... You need motivation 🚀", content: "You have conquered every tough day you've ever faced so far. You are capable, smart, and strong. Go show everyone how it's done!" },
      { title: "Open when... You just want a hug 🫂", content: "Wrap your arms around yourself and squeeze tight. Consider this a long, warm, non-negotiable hug directly from me to you." },
      { title: "Open when... You want to know how much I love you ❤️", content: "If I had to choose between breathing and loving you, I would use my last breath to tell you that you are my entire world, Leila." }
    ];

    // Audio Generator (Web Audio API)
    function playTone(freq, type, duration) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch(e){}
    }

    // Populate Envelopes
    const grid = document.getElementById('envelopeGrid');
    letters.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'envelope-card';
      card.innerHTML = `
        <div class="envelope-icon">✉️</div>
        <h3>${item.title}</h3>
      `;
      card.onclick = () => openLetter(idx);
      grid.appendChild(card);
    });

    function openLetter(idx) {
      playTone(523.25, 'sine', 0.3); // Soft chime C5
      document.getElementById('modalTitle').innerText = letters[idx].title;
      document.getElementById('modalContent').innerText = letters[idx].content;
      document.getElementById('letterModal').classList.add('active');
    }

    function closeLetter(e) {
      if (!e || e.target === document.getElementById('letterModal') || e.target.className === 'close-btn') {
        document.getElementById('letterModal').classList.remove('active');
      }
    }

    // Hug Animation
    function triggerVirtualHug() {
      playTone(329.63, 'sine', 0.6); // E4
      const overlay = document.getElementById('hugOverlay');
      overlay.classList.add('active');
      
      // Spawn extra floating hearts
      for(let i = 0; i < 25; i++) {
        createHeart();
      }

      setTimeout(() => {
        overlay.classList.remove('active');
      }, 1000);
    }

    // Dodging Love Button Mechanics
    const dodgeMessages = [
      "Wait, catch me first! 😜",
      "Are you sure? Try again! 💘",
      "Too slow! 😁",
      "You know the answer is YES! 💜",
      "Almost got me! ✨",
      "Infinite Love Locked! 🔒💖"
    ];
    let dodgeIndex = 0;

    function dodgeButton() {
      playTone(587.33, 'triangle', 0.15); // D5
      const btn = document.getElementById('loveBtn');
      const x = (Math.random() - 0.5) * 200;
      const y = (Math.random() - 0.5) * 100;
      
      btn.style.transform = `translate(${x}px, ${y}px)`;
      btn.innerText = dodgeMessages[dodgeIndex];
      dodgeIndex = (dodgeIndex + 1) % dodgeMessages.length;
    }

    // Canvas Background Floating Hearts
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class HeartParticle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 20;
        this.size = Math.random() * 12 + 6;
        this.speedY = Math.random() * 1.5 + 0.5;
        this.opacity = Math.random() * 0.5 + 0.3;
        this.color = `hsla(${Math.random() * 40 + 270}, 80%, 75%, ${this.opacity})`;
      }
      update() {
        this.y -= this.speedY;
        if (this.y < -20) this.reset();
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.font = `${this.size}px serif`;
        ctx.fillText('💜', this.x, this.y);
      }
    }

    function createHeart() {
      particles.push(new HeartParticle());
    }

    for (let i = 0; i < 30; i++) {
      particles.push(new HeartParticle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
      </html>
